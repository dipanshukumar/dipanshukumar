    <!-- Font loading optimization - bfcache friendly -->
    <script>
      // Font loading optimization without any unload handlers
      if ('fonts' in document) {
        // Use requestIdleCallback for better performance and bfcache compatibility
        const loadFonts = () => {
          Promise.all([
            document.fonts.load('300 1em Inter'),
            document.fonts.load('400 1em Inter'),
            document.fonts.load('500 1em Inter'),
            document.fonts.load('600 1em Inter'),
            document.fonts.load('700 1em Inter'),
            document.fonts.load('800 1em Inter')
          ]).then(() => {
            document.documentElement.classList.add('fonts-loaded');
          }).catch(() => {
            // Fallback if font loading fails
            document.documentElement.classList.add('fonts-fallback');
          });
        };
        
        // Use requestIdleCallback if available, otherwise setTimeout
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadFonts);
        } else {
          setTimeout(loadFonts, 1);
        }
      }
    </script>
